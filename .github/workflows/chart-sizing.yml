# Browser interactions are checked once by tabler-integration.yml.
# This workflow retains its original data, import, and model validation gates.
name: Check chart sizing
'on':
  pull_request:
    paths:
    - scripts/site-charts.js
    - scripts/regional-retail-charts.js
    - dutyfree-dashboard.html
    - tests/chart-sizing.browser.cjs
    - tests/site-paired.test.cjs
    - .github/workflows/chart-sizing.yml
  push:
    branches:
    - main
    paths:
    - scripts/site-charts.js
    - scripts/regional-retail-charts.js
    - dutyfree-dashboard.html
    - tests/chart-sizing.browser.cjs
    - tests/site-paired.test.cjs
    - .github/workflows/chart-sizing.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  chart-sizing:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - run: |
        node --test tests/site-paired.test.cjs
