# Browser interactions are checked once by tabler-integration.yml.
# This workflow retains its original data, import, and model validation gates.
name: Check consumption monthly product
'on':
  pull_request:
    paths:
    - consumption-monthly-product.html
    - scripts/consumption-monthly*
    - data/products/**
    - tests/consumption-monthly*
    - .github/workflows/check-consumption-monthly.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  product:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - run: node --test tests/consumption-monthly.test.cjs
    - run: node scripts/check-site.cjs
