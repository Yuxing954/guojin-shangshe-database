name: Check consumption monthly product
on:
  pull_request:
    paths:
      - 'consumption-monthly-product.html'
      - 'scripts/consumption-monthly*'
      - 'data/products/**'
      - 'tests/consumption-monthly*'
      - '.github/workflows/check-consumption-monthly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/consumption-monthly.test.cjs
      - run: node scripts/check-site.cjs
      - run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - run: node tests/consumption-monthly.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumption-monthly-preview
          path: .cache/monthly-product
