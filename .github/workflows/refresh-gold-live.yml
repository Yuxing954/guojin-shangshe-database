name: Refresh domestic gold snapshot
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gold-live
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update/gold_live.py
      - name: Publish changed source observation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/gold-jewelry/live.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh domestic gold source quote'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
