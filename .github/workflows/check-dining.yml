# Browser interactions are checked once by tabler-integration.yml.
# This workflow retains its original data, import, and model validation gates.
name: Dining update
'on':
  pull_request:
    paths:
    - dining.html
    - data/dining/observations.json
    - scripts/dining*
    - tests/dining*
    - .github/workflows/check-dining.yml
  push:
    branches:
    - main
    paths:
    - data/dining/observations.json
    - scripts/dining*
jobs:
  dining:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - run: node tests/dining-data.test.cjs
