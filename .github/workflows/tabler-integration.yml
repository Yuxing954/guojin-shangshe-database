name: Tabler native website

# Replaces the old layout-specific browser workflows. The data/import workflows
# remain active; every Node data/classification test is also retained below.
on:
  pull_request:
    paths:
      - '*.html'
      - 'scripts/**'
      - 'data/**'
      - 'data-manifest.json'
      - 'tests/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'scripts/**'
      - 'data/**'
      - 'data-manifest.json'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tabler-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  models:
    name: Data models and native contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check all page assets and JavaScript modules
        run: node scripts/check-site.cjs
      - name: Preserve all numerical and classification gates
        run: |
          test -s tests/tabler-native-model.test.cjs
          node --test --test-concurrency=1 scripts/*.test.cjs tests/*.test.cjs tests/*.test.js
          node scripts/market-kline.test.js
      - name: Check dutyfree calculated growth
        run: python -m unittest discover -s tests -p 'test_dutyfree_yoy.py'

  browser:
    name: Tabler interactions (${{ matrix.suite }})
    needs: models
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [core, research, market, layout]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/tabler-native" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/tabler-native/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check native routes, interactions, sources and exports
        run: node tests/tabler-native.browser.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/tabler-native/node_modules
          TABLER_NATIVE_SUITE: ${{ matrix.suite }}
          SITE_SCREENSHOT_DIR: artifacts/tabler-native/${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tabler-native-${{ matrix.suite }}
          path: artifacts/tabler-native/${{ matrix.suite }}
          if-no-files-found: warn
          retention-days: 14
