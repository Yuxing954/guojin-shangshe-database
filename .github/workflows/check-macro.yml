name: Check macro and predictions
on:
  pull_request:
    paths: ['macro.html', 'scripts/macro*', 'scripts/prediction-model.js', 'scripts/research-chart*', 'scripts/site*', 'data/macro/**', 'data/consumption-macro/**', 'update/macro_auto.py', 'update/macro_data.py', 'update/polymarket_data.py', 'tests/*macro*', '.github/workflows/check-macro.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check scripts/macro.js
          node --check scripts/macro-dashboard-model.js
          node --test tests/macro-dashboard.test.cjs
          node --check scripts/prediction-model.js
          node --check scripts/research-chart.js
          node --test tests/macro-refinement.test.cjs
          node --check scripts/site-shell.js
          node --test tests/macro.test.cjs
          python tests/test_macro_data.py
          python tests/test_macro_auto.py
          node --test tests/consumption-macro.test.cjs
          node scripts/site-data.test.cjs
          node scripts/industry-model.test.cjs
      - name: Install browser test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify macro dashboard in browser
        env:
          MACRO_SCREENSHOT_DIR: artifacts/macro
        run: node tests/macro-dashboard.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro-dashboard-previews
          path: artifacts/macro
          if-no-files-found: ignore

