# Browser interactions are checked once by tabler-integration.yml.
# This workflow retains its original data, import, and model validation gates.
name: Check macro and predictions
'on':
  pull_request:
    paths:
    - macro.html
    - scripts/macro*
    - scripts/prediction-model.js
    - scripts/fedwatch*
    - scripts/forecast-desk*
    - scripts/research-chart*
    - scripts/site*
    - data/macro/**
    - data/consumption-macro/**
    - data/gold-jewelry/macro.json
    - update/miaoxiang_mcp.py
    - tests/test_miaoxiang_credentials.py
    - update/macro_auto.py
    - update/treasury_yields.py
    - tests/test_treasury_yields.py
    - update/macro_data.py
    - update/polymarket_data.py
    - update/fedwatch_import.cjs
    - tests/fedwatch-import.test.cjs
    - tests/*macro*
    - tests/polymarket*
    - .github/workflows/check-macro.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - run: |
        node --check scripts/macro.js
        node --check scripts/macro-dashboard-model.js
        node --test tests/macro-dashboard.test.cjs
        node --test tests/macro-expectations.test.cjs
        node --check scripts/prediction-model.js
        node --check scripts/forecast-desk.js
        node --test tests/forecast-macro.test.cjs
        node --test tests/fedwatch-import.test.cjs
        node --check scripts/research-chart.js
        node --test tests/macro-refinement.test.cjs
        node --check scripts/site-shell.js
        node --test tests/macro.test.cjs
        python tests/test_macro_data.py
        python tests/test_macro_auto.py
        python tests/test_macro_refresh_speed.py
        python tests/test_treasury_yields.py
        python tests/test_miaoxiang_credentials.py
        node --test tests/consumption-macro.test.cjs
        node scripts/site-data.test.cjs
        node scripts/industry-model.test.cjs
