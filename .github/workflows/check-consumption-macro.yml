name: Check consumption macro
on:
  pull_request:
    paths:
      - 'consumption-macro.html'
      - 'scripts/consumption-macro*'
      - 'scripts/research-chart*'
      - 'scripts/macro-refinements.css'
      - 'tests/macro-refinement.test.cjs'
      - 'scripts/import_consumption_macro.py'
      - 'scripts/site-shell.js'
      - 'data/consumption-macro/**'
      - 'data/macro/automatic-series.json'
      - 'tests/*consumption_macro*'
      - 'tests/consumption-macro*'
      - '.github/workflows/check-consumption-macro.yml'
  push:
    branches: [main]
    paths:
      - 'consumption-macro.html'
      - 'scripts/consumption-macro*'
      - 'scripts/research-chart*'
      - 'scripts/macro-refinements.css'
      - 'tests/macro-refinement.test.cjs'
      - 'scripts/import_consumption_macro.py'
      - 'data/consumption-macro/**'
      - 'data/macro/automatic-series.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate official data and dashboard
        run: |
          node --check scripts/consumption-macro.js
          node --check scripts/research-chart.js
          node --test tests/macro-refinement.test.cjs
          node --check scripts/site-shell.js
          node --test tests/consumption-macro.test.cjs
          python -m unittest discover -s tests -p 'test_consumption_macro.py' -v

