# Browser interactions are checked once by tabler-integration.yml.
# This workflow retains its original data, import, and model validation gates.
name: Check hotel groups
'on':
  pull_request:
    paths:
    - hotel-groups.html
    - hotel-dashboard.html
    - hotel-holiday-dashboard.html
    - scripts/hotel-group*
    - scripts/industry-panels.js
    - scripts/site-charts.*
    - data/hotel_group_weekly.csv
    - tests/hotel-groups.browser.cjs
    - .github/workflows/check-hotel-groups.yml
permissions:
  contents: read
jobs:
  hotel-groups:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - run: node scripts/hotel-groups-model.test.cjs
