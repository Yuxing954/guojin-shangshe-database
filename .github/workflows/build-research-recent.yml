name: Build research and home summaries

on:
  push:
    branches: [main]
    paths:
      - "data/**/*.csv"
      - "data-manifest.json"
      - "scripts/build_home_snapshot.py"
      - "scripts/build_industry_snapshot.py"
      - "data/industry/miaoxiang-*.json"
      - "data/industry/verified-*.json"
      - "scripts/build_research_recent.py"
      - "scripts/research_sources.py"
      - "scripts/build_research_shards.py"
      - "scripts/*market_sync*.mjs"
      - "scripts/sync_market_views.mjs"
      - "scripts/test_market_sync_receipt.py"
      - "data/research/updates/manifest.json"
      - "scripts/build_site_summaries.py"
      - "scripts/build_resource_index.py"
      - "scripts/summary_io.py"
      - "data/research/library.json"
      - "data/research/library-pending/**"
      - "scripts/apply_library_upload.py"
      - "scripts/test_library_upload.py"
      - "data/industry/overview.json"
      - "data/sectors/**"
      - "scripts/update_sector_data.py"
      - ".github/workflows/build-research-recent.yml"
  schedule:
    # 每天 02:30 UTC（北京时间 10:30）；仅整理仓库已有的数据
    - cron: "30 2 * * *"
  workflow_dispatch:           # 允许手动触发

concurrency:
  group: research-summaries-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write              # GITHUB_TOKEN 需要写权限才能 push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect prebuilt dutyfree-only update
        id: dutyfree
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: echo "only=$(python scripts/is_dutyfree_only.py --base "$BEFORE_SHA" --head "$AFTER_SHA")" >> "$GITHUB_OUTPUT"

      - name: Validate prebuilt dutyfree snapshot
        if: steps.dutyfree.outputs.only == 'true'
        run: python scripts/update_dutyfree_monthly.py --check
      - uses: actions/cache@v4
        if: steps.dutyfree.outputs.only != 'true'
        with:
          path: .cache/research-build.json
          key: summaries-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: summaries-${{ runner.os }}-${{ github.ref_name }}-

      # Keep connector payloads bounded; merge only checksum-verified metadata.
      - name: Test and apply verified library upload chunks
        if: steps.dutyfree.outputs.only != 'true'
        run: |
          python scripts/test_library_upload.py
          python scripts/apply_library_upload.py

      - name: Validate and update sector histories from reviewed evidence
        if: steps.dutyfree.outputs.only != 'true'
        run: python scripts/update_sector_data.py

      - name: Build only changed summaries and resource directory
        if: steps.dutyfree.outputs.only != 'true'
        run: python scripts/build_site_summaries.py

      - uses: actions/setup-node@v4
        if: steps.dutyfree.outputs.only != 'true'
        with:
          node-version: "22"

      - name: Test resumable market-view updater
        if: steps.dutyfree.outputs.only != 'true'
        run: node --test scripts/test_market_sync.mjs

      - name: Test export validation receipt
        if: steps.dutyfree.outputs.only != 'true'
        run: python scripts/test_market_sync_receipt.py

      - name: Test market-view JSON exports
        if: steps.dutyfree.outputs.only != 'true'
        run: python scripts/test_research_market_views.py

      - name: Build connector-readable archive and dedup index
        if: steps.dutyfree.outputs.only != 'true'
        run: python scripts/build_research_shards.py

      - name: Validate generated complete market-view export
        if: steps.dutyfree.outputs.only != 'true'
        run: python scripts/test_research_market_views.py --verify-generated

      - name: Commit & push if changed
        if: steps.dutyfree.outputs.only != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/archive data/research/market-views-all.json data/research/recent.json data/research/recent-preview.json data/home-snapshot.json data/industry/overview.json data/research/resource-index.json data/sectors/overseas.json data/sectors/dining.json data/sectors/update-status.json
          git add -u data/research
          if [ -f data/research/library-sync-receipt.json ]; then git add data/research/library-sync-receipt.json; fi
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "data: refresh research and home summaries $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

