name: Build research and home summaries

on:
  push:
    branches: [main]
    paths:
      - "data/**/*.csv"
      - "data-manifest.json"
      - "scripts/build_home_snapshot.py"
      - "scripts/build_industry_snapshot.py"
      - "data/industry/miaoxiang-*.json"
      - "data/industry/verified-*.json"
      - "scripts/build_research_recent.py"
      - "scripts/research_sources.py"
      - "data/research/updates/manifest.json"
      - "scripts/build_site_summaries.py"
      - "scripts/build_resource_index.py"
      - "scripts/summary_io.py"
      - "data/research/library.json"
      - "data/industry/overview.json"
      - ".github/workflows/build-research-recent.yml"
  schedule:
    # 每天 02:30 UTC（北京时间 10:30）；仅整理仓库已有的数据
    - cron: "30 2 * * *"
  workflow_dispatch:           # 允许手动触发

concurrency:
  group: research-summaries-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write              # GITHUB_TOKEN 需要写权限才能 push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: .cache/research-build.json
          key: summaries-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: summaries-${{ runner.os }}-${{ github.ref_name }}-

      - name: Build only changed summaries and resource directory
        run: python scripts/build_site_summaries.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/recent.json data/home-snapshot.json data/industry/overview.json data/research/resource-index.json
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "data: refresh research and home summaries $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
