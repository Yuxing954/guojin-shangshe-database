name: Design system
on:
  pull_request:
    paths: ['scripts/tabler-app/**', 'scripts/vendor/tabler/**', 'tools/design-system/**', 'tests/visual/**', 'tests/tabler-design.visual.py', '.github/workflows/design-system.yml']
permissions:
  contents: read
jobs:
  components:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16'
      - run: npm ci && npm run build
        working-directory: tools/design-system
  visual:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0 pillow==11.3.0
      - run: python tests/tabler-design.visual.py
        env:
          TABLER_BROWSER_EXECUTABLE: C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sparkline-comparison
          path: test-results/tabler-spark-*.png
