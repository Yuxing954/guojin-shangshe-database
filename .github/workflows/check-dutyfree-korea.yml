# Browser interactions are checked once by tabler-integration.yml.
# This workflow retains its original data, import, and model validation gates.
name: Check Korea dutyfree
'on':
  pull_request:
    paths:
    - dutyfree-dashboard.html
    - scripts/dutyfree-korea*
    - scripts/import_korea_dutyfree.py
    - scripts/industry-embed.js
    - scripts/industry-panels.js
    - data/dutyfree/korea.json
    - tests/dutyfree-korea*
    - .github/workflows/check-dutyfree-korea.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  korea-dutyfree:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - run: node --test tests/dutyfree-korea.test.cjs tests/dutyfree-monthly.test.cjs
