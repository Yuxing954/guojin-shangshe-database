name: Check shared hub navigation
on:
  pull_request:
    paths: ['macro.html', 'regional-retail.html', 'industry.html', 'scripts/hub-navigation.css', 'scripts/macro-design.css', 'scripts/industry-design.css', 'scripts/regional-retail.css', 'scripts/site-shell.js', 'scripts/site-ui.js', 'scripts/site.css', 'scripts/site-polish.css', 'tests/hub-navigation.browser.cjs', '.github/workflows/hub-navigation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hub-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo 'PLAYWRIGHT_CHANNEL=chrome' >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: node tests/hub-navigation.browser.cjs
