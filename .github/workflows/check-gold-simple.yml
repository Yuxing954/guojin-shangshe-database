name: Check simplified gold dashboard
on:
  pull_request:
    paths:
      - 'industry.html'
      - 'scripts/gold-jewelry.js'
      - 'scripts/gold-live.js'
      - 'tests/gold-simple.browser.cjs'
      - '.github/workflows/check-gold-simple.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-site.cjs
      - run: node --test tests/gold-jewelry.test.js tests/gold-research.test.js tests/gold-macro.test.js scripts/gold-live-model.test.cjs
      - run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - run: node tests/gold-simple.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-simple-preview
          path: .cache/gold-simple
