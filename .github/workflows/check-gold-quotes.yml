name: Gold quotes
on:
  pull_request:
    paths: ['quotes.html', 'scripts/quotes*.js', 'scripts/gold-quotes.*', 'tests/gold-quotes.browser.cjs', '.github/workflows/check-gold-quotes.yml']
  push:
    branches: [main]
    paths: ['quotes.html', 'scripts/quotes*.js', 'scripts/gold-quotes.*', 'tests/gold-quotes.browser.cjs', '.github/workflows/check-gold-quotes.yml']
  workflow_dispatch:
jobs:
  gold-quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Quotes model and lifecycle
        run: |
          node --check scripts/gold-quotes.js
          node --check scripts/quotes.js
          node --test scripts/quotes-model.test.cjs scripts/quotes-layout.test.cjs scripts/quotes-lifecycle.test.cjs scripts/quotes-charts.test.cjs scripts/quotes-poller.test.cjs
      - name: Browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/gold-browser" playwright@1.62.1
          echo "NODE_PATH=$RUNNER_TEMP/gold-browser/node_modules" >> "$GITHUB_ENV"
          if [ -x /usr/bin/google-chrome ]; then
            echo "EDGE_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          else
            "$RUNNER_TEMP/gold-browser/node_modules/.bin/playwright" install --with-deps chromium
          fi
      - name: Gold widget lifecycle and responsive layout
        run: node tests/gold-quotes.browser.cjs
