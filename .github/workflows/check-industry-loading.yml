# Browser interactions are checked once by tabler-integration.yml.
# This workflow retains its original data, import, and model validation gates.
name: Check industry loading
'on':
  pull_request:
    paths:
    - industry.html
    - '*dashboard.html'
    - dining.html
    - scripts/dining*
    - data/dining/**
    - tests/dining*
    - scripts/industry*
    - scripts/cruise-dashboard.*
    - data/tourism/**
    - tests/cruise*
    - tests/industry-loading.browser.cjs
    - .github/workflows/check-industry-loading.yml
permissions:
  contents: read
jobs:
  industry-loading:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Check script syntax
      run: |
        node tests/dining-data.test.cjs
        node --check scripts/dining.js
        node --check scripts/dining-model.js
        node --check scripts/industry.js
        node --check scripts/industry-panels.js
        node --check scripts/industry-embed.js
        node --check scripts/cruise-dashboard.js
        node tests/cruise-data.test.cjs
