name: Check recruitment charts
on:
  pull_request:
    paths: ['recruitment.html', 'scripts/recruitment.js', 'scripts/recruitment.css', 'scripts/site-charts.js', 'scripts/site-charts.css', 'tests/recruitment-charts.browser.cjs', '.github/workflows/recruitment-charts.yml']
  push:
    branches: [main]
    paths: ['recruitment.html', 'scripts/recruitment.js', 'scripts/recruitment.css', 'scripts/site-charts.js', 'scripts/site-charts.css', 'tests/recruitment-charts.browser.cjs', '.github/workflows/recruitment-charts.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recruitment-charts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo 'PLAYWRIGHT_CHANNEL=chrome' >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: node tests/recruitment-charts.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recruitment-chart-previews
          path: artifacts/chart-sizing
          if-no-files-found: ignore
