# Browser interactions are checked once by tabler-integration.yml.
# This workflow retains its original data, import, and model validation gates.
name: Check domestic hotels
'on':
  pull_request:
    paths:
    - company-database.html
    - domestic-hotel-comparison.html
    - scripts/domestic-hotels*
    - scripts/company-database.*
    - scripts/company-overview.*
    - scripts/jinjiang-research.*
    - scripts/hotel-research.css
    - scripts/overseas-hotels.css
    - scripts/site-charts*
    - scripts/assets/domestic-hotels/**
    - data/companies/domestic-hotels*
    - data/companies/domestic-hotels/**
    - tests/domestic-hotels*
    - .github/workflows/check-domestic-hotels.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  domestic-hotels:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - run: node --test tests/domestic-hotels.test.cjs
