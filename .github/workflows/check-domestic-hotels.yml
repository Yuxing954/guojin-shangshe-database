name: Check domestic hotels
on:
  pull_request:
    paths:
      - 'company-database.html'
      - 'domestic-hotel-comparison.html'
      - 'scripts/domestic-hotels*'
      - 'scripts/overseas-hotels.css'
      - 'scripts/site-charts*'
      - 'scripts/assets/domestic-hotels/**'
      - 'data/companies/domestic-hotels*'
      - 'data/companies/domestic-hotels/**'
      - 'tests/domestic-hotels*'
      - '.github/workflows/check-domestic-hotels.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  domestic-hotels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/domestic-hotels.test.cjs
      - run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - run: node tests/domestic-hotels.browser.cjs
