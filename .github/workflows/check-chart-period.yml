# Browser interactions are checked once by tabler-integration.yml.
# This workflow retains its original data, import, and model validation gates.
name: Check chart date axes
'on':
  pull_request:
    paths:
    - '*.html'
    - scripts/**
    - tests/chart-period*
    - tests/chart-defaults*
    - .github/workflows/check-chart-period.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  chart-period:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - run: node --test tests/chart-period.test.cjs
