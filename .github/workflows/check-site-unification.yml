name: Check shared website UI
on:
  pull_request:
    paths:
      - '*.html'
      - 'scripts/*.css'
      - 'scripts/*.js'
      - 'tests/site-*'
      - '.github/workflows/check-site-unification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source and shared behavior
        run: |
          node scripts/check-site.cjs
          node --test scripts/*.test.cjs tests/*.test.cjs tests/*.test.js
      - name: Check dutyfree calculated growth
        run: python -m unittest discover -s tests -p 'test_dutyfree_yoy.py'
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Check all pages and specialist interactions
        env:
          SITE_SCREENSHOT_DIR: .cache/site-unification
        run: |
          node tests/site-charts.browser.cjs
          node tests/site-unification.browser.cjs
          node tests/macro-dashboard.browser.cjs
          node tests/consumption-macro.browser.cjs
          node tests/earnings-calendar.browser.cjs
          node tests/quotes-workbench.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-browser-verification
          path: .cache/site-unification
