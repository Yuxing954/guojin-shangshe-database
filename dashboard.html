<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>国金商社 · 数据库</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#fafafa;--card:#fff;--ink:#18181b;--mut:#71717a;--line:#e4e4e7;--brand:#4f46e5;--up:#c83c3c;--down:#2e8c6d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1320px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px}.kicker{font-size:11px;letter-spacing:.25em;color:#a1a1aa}.title{font-size:24px;font-weight:700;margin-top:4px}.sub{font-size:13px;color:var(--mut);margin-top:4px}.status{font-size:12px;color:var(--mut)}.grid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px}.side,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px}.side{padding:10px;align-self:start;position:sticky;top:14px}.group{padding:12px 10px 6px;font-size:11px;color:#a1a1aa}.ds{width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:9px;cursor:pointer;font:inherit;font-size:13px;color:var(--mut)}.ds:hover{background:#f4f4f5;color:var(--ink)}.ds.on{background:var(--brand);color:#fff}.main{min-width:0}.panel{padding:16px;margin-bottom:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;font:inherit}.toolbar input{min-width:260px;flex:1}.meta{font-size:12px;color:var(--mut);margin-top:10px}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.kpi .l{font-size:12px;color:var(--mut)}.kpi .v{font-size:22px;font-weight:700;margin-top:4px}.tblwrap{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;font-size:12px;min-width:900px}th,td{padding:8px 10px;border-bottom:1px solid #f0f0f0;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#fafafa;z-index:1;color:var(--mut);font-weight:600}tr:hover td{background:#fafafa}.num{text-align:right;font-variant-numeric:tabular-nums}.up{color:var(--up)}.down{color:var(--down)}.empty{padding:40px;text-align:center;color:var(--mut)}.chartbox{height:320px}@media(max-width:820px){.grid{grid-template-columns:1fr}.side{position:static}.toolbar input{min-width:100%}.wrap{padding:14px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div><div class="kicker">GUOJIN RETAIL & SERVICES</div><div class="title">国金商社 · 线上可视化数据库</div><div class="sub">GitHub CSV 直连版 · 数据文件更新后网页自动读取最新内容</div></div><div class="status" id="status">初始化中…</div></div>
  <div class="grid">
    <aside class="side" id="nav"></aside>
    <main class="main">
      <div class="panel"><div class="toolbar"><select id="col"></select><input id="q" placeholder="搜索当前数据表"><button id="reload">刷新数据</button></div><div class="meta" id="meta"></div></div>
      <div class="panel" id="kpis"></div>
      <div class="panel" id="chartPanel" style="display:none"><div class="chartbox"><canvas id="chart"></canvas></div></div>
      <div class="panel"><div class="tblwrap" id="table"></div></div>
    </main>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);let manifest=null,current=null,rows=[],filtered=[],chart=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function isNum(v){return v!==''&&v!=null&&!Number.isNaN(Number(v))}
function fmt(v){if(!isNum(v))return v??'';return Number(v).toLocaleString('zh-CN',{maximumFractionDigits:4})}
async function init(){try{manifest=await fetch('data-manifest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()});renderNav();await load(manifest.datasets[0]);$('status').textContent='数据清单：'+manifest.updatedAt}catch(e){$('status').textContent='加载失败';$('table').innerHTML='<div class="empty">无法读取 data-manifest.json：'+esc(e.message)+'</div>'}}
function renderNav(){const cats={};manifest.datasets.forEach(d=>(cats[d.category]??=[]).push(d));$('nav').innerHTML=Object.entries(cats).map(([c,ds])=>'<div class="group">'+esc(c)+'</div>'+ds.map(d=>'<button class="ds" data-id="'+esc(d.id)+'">'+esc(d.name)+'</button>').join('')).join('');$('nav').onclick=e=>{const b=e.target.closest('.ds');if(!b)return;const d=manifest.datasets.find(x=>x.id===b.dataset.id);load(d)}}
async function load(ds){current=ds;document.querySelectorAll('.ds').forEach(b=>b.classList.toggle('on',b.dataset.id===ds.id));$('status').textContent='正在读取 '+ds.name+'…';$('table').innerHTML='<div class="empty">加载中…</div>';try{const text=await fetch(encodeURI(ds.file),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status+' '+r.statusText);return r.text()});const out=Papa.parse(text,{header:true,skipEmptyLines:true,dynamicTyping:false});rows=out.data;setupCols(out.meta.fields||[]);apply();$('status').textContent='已连接 · '+ds.name}catch(e){rows=[];$('table').innerHTML='<div class="empty">读取失败：'+esc(e.message)+'</div>';$('status').textContent='读取失败'}}
function setupCols(cols){$('col').innerHTML='<option value="">全部字段</option>'+cols.map(c=>'<option>'+esc(c)+'</option>').join('')}
function apply(){const q=$('q').value.trim().toLowerCase(),col=$('col').value;filtered=rows.filter(r=>!q||String(col?r[col]??'':Object.values(r).join(' ')).toLowerCase().includes(q));$('meta').textContent=`${current.name} · ${filtered.length.toLocaleString()} / ${rows.length.toLocaleString()} 行 · ${Object.keys(rows[0]||{}).length} 列 · ${current.file}`;renderKpis();renderTable();renderChart()}
function renderKpis(){const r=filtered[filtered.length-1]||{};const keys=Object.keys(r).filter(k=>isNum(r[k])).slice(0,4);$('kpis').innerHTML=keys.length?'<div class="kpis">'+keys.map(k=>'<div class="kpi"><div class="l">'+esc(k)+'</div><div class="v">'+esc(fmt(r[k]))+'</div></div>').join('')+'</div>':'<div class="empty">当前数据表无可直接汇总的数值字段</div>'}
function renderTable(){if(!filtered.length){$('table').innerHTML='<div class="empty">当前筛选无数据</div>';return}const cols=Object.keys(filtered[0]);const limit=1000,show=filtered.slice(0,limit);let h='<table><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>';show.forEach(r=>{h+='<tr>'+cols.map(c=>{const v=r[c],n=isNum(v),num=n?Number(v):null,cls=n?'num '+((String(c).includes('同比')||String(c).includes('涨跌'))?(num>0?'up':num<0?'down':''):''):'';return '<td class="'+cls+'">'+esc(n?fmt(v):v)+'</td>'}).join('')+'</tr>'});h+='</tbody></table>';if(filtered.length>limit)h+='<div class="meta" style="padding:8px">仅展示前 '+limit+' 行；搜索可缩小范围。</div>';$('table').innerHTML=h}
function renderChart(){if(chart){chart.destroy();chart=null}const dateKey=['数据日期','日期','时间','月份','财报期'].find(k=>rows[0]&&k in rows[0]);const numKey=Object.keys(rows[0]||{}).find(k=>k!==dateKey&&rows.filter(r=>isNum(r[k])).length>Math.min(10,rows.length*.5));if(!dateKey||!numKey){$('chartPanel').style.display='none';return}const d=filtered.filter(r=>isNum(r[numKey])).slice(-60);if(!d.length){$('chartPanel').style.display='none';return}$('chartPanel').style.display='block';chart=new Chart($('chart'),{type:'line',data:{labels:d.map(r=>String(r[dateKey]).slice(0,10)),datasets:[{label:numKey,data:d.map(r=>Number(r[numKey])),borderWidth:2,pointRadius:0,tension:.2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{x:{ticks:{maxTicksLimit:12},grid:{display:false}},y:{grid:{color:'#eee'}}}}})}
$('q').addEventListener('input',apply);$('col').addEventListener('change',apply);$('reload').addEventListener('click',()=>current&&load(current));init();
</script>
</body></html>
