<script>
/* ---------- 工具 ---------- */
function csv(t){let a=[],r=[],v='',q=false;for(let i=0;i<t.length;i++){let c=t[i],n=t[i+1];if(q){if(c==='"'&&n==='"'){v+='"';i++}else if(c==='"')q=false;else v+=c}else if(c==='"')q=true;else if(c===','){r.push(v);v=''}else if(c==='\n'){r.push(v.replace(/\r$/,''));a.push(r);r=[];v=''}else v+=c}if(v||r.length){r.push(v);a.push(r)}let h=a.shift().map(x=>x.replace(/^\ufeff/,''));return a.filter(x=>x.some(Boolean)).map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]])))}
const N=x=>{let n=Number(x);return isFinite(n)&&x!==''&&x!=null?n:null},F=(x,d=1)=>N(x)==null?'—':N(x).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});
const C=v=>v>0?'up':v<0?'down':'',P=(v,d=1)=>N(v)==null?'—':`${v>0?'+':''}${F(v,d)}%`,Pf=(v,d=1,ty)=>N(v)==null?'—':(ty==='pct'?`${v>0?'+':''}${F(v,d)}pct`:P(v,d));
const W=(v,d=1,ty)=>`<span class="${C(v)}">${Pf(v,d,ty)}</span>`,Dash=v=>v==null||v===''||v==='—'?'—':v;
let DB={},SRC={};
const jf=u=>fetch(u,{cache:'no-store'}).then(r=>r.json());
Promise.all([
 jf('data/dutyfree/sources.json').then(d=>DB.sources=d),
 fetch('data/dutyfree_monthly.csv',{cache:'no-store'}).then(r=>r.text()).then(t=>DB.m=csv(t)),
 fetch('data/dutyfree_holiday.csv',{cache:'no-store'}).then(r=>r.text()).then(t=>DB.h=csv(t))
]).then(()=>{SRC=DB.sources.sources||{};init()}).catch(e=>{document.getElementById('asof').textContent='数据读取失败';console.log(e)});

function showSrc(key){let s=SRC[key];let b=document.getElementById('srcbox');
 if(!s){b.innerHTML='<h3>数据来源</h3><div class="muted">暂无来源信息</div><div class="closebtn"><button class="srcbtn" onclick="document.getElementById(\'srcmodal\').classList.remove(\'on\')">关闭</button></div>';}
 else{b.innerHTML=`<h3>数据来源</h3>
 <div class="row"><b>来源名称</b><span>${Dash(s.sourceName)}</span></div>
 <div class="row"><b>来源类型</b><span>${Dash(s.sourceType)}</span></div>
 <div class="row"><b>报告日期</b><span>${Dash(s.reportDate)}</span></div>
 <div class="row"><b>页码</b><span>${Dash(s.page)}</span></div>
 <div class="row"><b>链接</b><span>${s.url?`<a href="${s.url}" target="_blank" style="color:var(--blue)">原文链接</a>`:'—'}</span></div>
 <div class="row"><b>备注</b><span>${Dash(s.note)}</span></div>
 <div class="closebtn"><button class="srcbtn" onclick="document.getElementById('srcmodal').classList.remove('on')">关闭</button></div>`;}
 document.getElementById('srcmodal').classList.add('on')}
document.getElementById('srcmodal').addEventListener('click',e=>{if(e.target.id==='srcmodal')e.target.classList.remove('on')});

/* ---------- SVG 绘图 ---------- */
function draw(svg,rows,series,zero=false){if(!svg||!rows||!rows.length){if(svg){svg.setAttribute('viewBox','0 0 620 210');svg.innerHTML='<text x="310" y="110" text-anchor="middle" class="axis">暂无数据</text>'}return}
try{let w=620,h=210,l=38,r=12,t=16,b=24,all=series.flatMap(s=>rows.map(s.get)).filter(Number.isFinite);if(!all.length){svg.innerHTML='<text x="310" y="110" text-anchor="middle" class="axis">暂无数据</text>';return}
let mi=Math.min(...all),ma=Math.max(...all),pad=(ma-mi)*.12||1;mi-=pad;ma+=pad;if(zero){mi=Math.min(mi,0);ma=Math.max(ma,0)}
let x=i=>l+i/Math.max(1,rows.length-1)*(w-l-r),y=v=>t+(ma-v)/(ma-mi)*(h-t-b),html='';
for(let j=0;j<4;j++){let v=ma-j*(ma-mi)/3,yy=y(v);html+=`<line class="gridline" x1="${l}" y1="${yy}" x2="${w-r}" y2="${yy}"/><text class="axis" x="${l-5}" y="${yy+3}" text-anchor="end">${F(v,0)}</text>`}
if(mi<0&&ma>0)html+=`<line x1="${l}" y1="${y(0)}" x2="${w-r}" y2="${y(0)}" stroke="#aeb8c2"/>`;
let lbl=[0,Math.floor((rows.length-1)/2),rows.length-1].filter((q,i,a)=>a.indexOf(q)===i);
lbl.forEach(i=>{if(rows[i])html+=`<text class="axis" x="${x(i)}" y="${h-6}" text-anchor="${i===0?'start':i===rows.length-1?'end':'middle'}">${rows[i].period_id||rows[i].period||''}</text>`});
series.forEach(s=>{let pts=rows.map((z,i)=>({v:s.get(z),i})).filter(o=>Number.isFinite(o.v));html+=`<path class="line" d="${pts.map((o,j)=>(j?'L':'M')+x(o.i)+' '+y(o.v)).join(' ')}" stroke="${s.color}"/>`});
html+=`<rect class="hit" x="${l}" y="${t}" width="${w-l-r}" height="${h-t-b}" fill="transparent"/>`;
svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.innerHTML=html;
let hit=svg.querySelector('.hit'),tip=svg.parentElement.querySelector('.tooltip');
if(hit&&tip){hit.onmousemove=e=>{let box=svg.getBoundingClientRect(),px=(e.clientX-box.left)/box.width*w,i=Math.max(0,Math.min(rows.length-1,Math.round((px-l)/(w-l-r)*(rows.length-1)))),row=rows[i];tip.innerHTML=`<b>${row.period_id||row.period}</b><br>${series.map(s=>`${s.name}：${F(s.get(row),1)}${s.unit||''}`).join('<br>')}`;tip.style.display='block';tip.style.left=Math.min(e.offsetX+12,svg.clientWidth-140)+'px';tip.style.top=Math.max(8,e.offsetY-15)+'px'};hit.onmouseleave=()=>tip.style.display='none'}}catch(e){console.log('draw err',e)}}
function drawBar(svg,rows,series){if(!svg||!rows||!rows.length){if(svg){svg.setAttribute('viewBox','0 0 620 210');svg.innerHTML='<text x="310" y="110" text-anchor="middle" class="axis">暂无数据</text>'}return}try{let w=620,h=210,l=38,r=12,t=16,b=24,all=series.flatMap(s=>rows.map(s.get)).filter(Number.isFinite);if(!all.length){svg.innerHTML='<text x="310" y="110" text-anchor="middle" class="axis">暂无数据</text>';return}
let mi=Math.min(0,...all),ma=Math.max(0,...all),pad=(ma-mi)*.12||1;ma+=pad;mi-=pad;let x=i=>l+i/rows.length*(w-l-r),bw=(w-l-r)/rows.length*.6/series.length,y=v=>t+(ma-v)/(ma-mi)*(h-t-b),html='';
for(let j=0;j<4;j++){let v=ma-j*(ma-mi)/3,yy=y(v);html+=`<line class="gridline" x1="${l}" y1="${yy}" x2="${w-r}" y2="${yy}"/><text class="axis" x="${l-5}" y="${yy+3}" text-anchor="end">${F(v,0)}</text>`}
rows.forEach((row,i)=>{html+=`<text class="axis" x="${x(i)+bw*series.length/2}" y="${h-6}" text-anchor="middle">${row.period}</text>`;series.forEach((s,k)=>{let v=s.get(row);if(Number.isFinite(v)){let yy=y(Math.max(0,v)),hh=Math.abs(y(v)-y(0));html+=`<rect x="${x(i)+k*bw}" y="${yy}" width="${bw-2}" height="${hh}" fill="${s.color}" rx="1"/>`}})});
if(mi<0)html+=`<line x1="${l}" y1="${y(0)}" x2="${w-r}" y2="${y(0)}" stroke="#aeb8c2"/>`;
svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.innerHTML=html}catch(e){console.log('drawBar err',e)}}

/* ---------- 行业总览 ---------- */
const trendMetrics={
sales:{label:'购物金额',field:'shopping_sales_cny_100m',yoy:'sales_yoy_pct',unit:'亿元',color:'#3d708e'},
shoppers:{label:'购物人次',field:'shoppers_10k',yoy:'shoppers_yoy_pct',unit:'万人次',color:'#b47a3d'},
items:{label:'购物件数',field:'items_10k',yoy:'items_yoy_pct',unit:'万件',color:'#2d7b70'},
spend:{label:'每人次消费',field:'spend_per_shopper_cny',yoy:'spend_per_shopper_yoy_pct',unit:'元',color:'#8a6884'}
};
function drawCombo(svg,rows,metric){
const w=760,h=330,l=54,r=60,t=28,b=50,barColor='#6f95ca',lineColor='#6656bd',gradient=svg.id+'-bars';
svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
const panel=svg.closest('.chart');let legend=panel.querySelector('.combo-legend');if(!legend){legend=document.createElement('div');legend.className='combo-legend';svg.before(legend);}
legend.innerHTML=`<span><i class="legend-bar"></i>${metric.label}<small>${metric.unit} · 左轴</small></span><span><i class="legend-line"></i>同比增速<small>% · 右轴</small></span><small class="legend-hint">悬停查看月份详情</small>`;
const values=rows.map(row=>N(row[metric.field])),growth=rows.map(row=>N(row[metric.yoy]));
if(!rows.length||!values.some(Number.isFinite)&&!growth.some(Number.isFinite)){svg.innerHTML='<text class="axis" x="380" y="165" text-anchor="middle">暂无数据</text>';return;}
const rawMax=Math.max(0,...values.filter(Number.isFinite))||1,nice=v=>{const scale=10**Math.floor(Math.log10(v)),n=v/scale;return(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*scale;},maxValue=nice(rawMax*1.12/4)*4;
let lo=Math.min(0,...growth.filter(Number.isFinite)),hi=Math.max(0,...growth.filter(Number.isFinite));const pad=(hi-lo)*.12||5,growthStep=nice((hi-lo+pad*2)/4);lo=Math.floor((lo-pad)/growthStep)*growthStep;hi=Math.ceil((hi+pad)/growthStep)*growthStep;
const step=(w-l-r)/rows.length,x=i=>l+(i+.5)*step,yValue=v=>h-b-v/maxValue*(h-t-b),yGrowth=v=>t+(hi-v)/(hi-lo)*(h-t-b),width=Math.min(30,step*.55);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const title=i=>esc(`${rows[i].period_id}：${metric.label} ${F(values[i],metric.unit==='元'?0:2)} ${metric.unit}；同比 ${P(growth[i])}`);
let html=`<defs><linearGradient id="${gradient}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6f95ca"/><stop offset="100%" stop-color="#c3d5ed"/></linearGradient></defs><text class="axis" x="${l}" y="14">${metric.unit}</text><text class="axis" x="${w-r+8}" y="14">%</text>`;
for(let j=0;j<5;j++){const yy=t+j*(h-t-b)/4;html+=`<line class="gridline" x1="${l}" x2="${w-r}" y1="${yy}" y2="${yy}"/><text class="axis" x="${l-10}" y="${yy+4}" text-anchor="end">${F(maxValue*(1-j/4),maxValue<5?1:0)}</text><text class="axis" x="${w-r+10}" y="${yy+4}">${F(hi-j*(hi-lo)/4,0)}</text>`;}
html+=`<line x1="${l}" x2="${w-r}" y1="${yGrowth(0)}" y2="${yGrowth(0)}" stroke="#a89fcd" stroke-dasharray="3 5" opacity=".5"/>`;
rows.forEach((row,i)=>{if(row.period_id.endsWith('-01')&&i>0)html+=`<line x1="${x(i)-step/2}" x2="${x(i)-step/2}" y1="${t}" y2="${h-b}" stroke="#e6e8ef" stroke-dasharray="3 4"/>`;});
values.forEach((v,i)=>{if(!Number.isFinite(v))return;html+=`<rect class="combo-bar" data-index="${i}" x="${x(i)-width/2}" y="${yValue(v)}" width="${width}" height="${h-b-yValue(v)}" fill="url(#${gradient})" rx="3"><title>${title(i)}</title></rect>`;
if(rows.length<=12){const inside=Number.isFinite(growth[i])&&Math.abs(yValue(v)-yGrowth(growth[i]))<32&&h-b-yValue(v)>24;html+=`<text class="combo-value" x="${x(i)}" y="${yValue(v)+(inside?15:-9)}" text-anchor="middle" fill="${inside?'#fff':'#70829e'}">${F(v,metric.unit==='元'?0:1)}</text>`;}});
let path='',connected=false;growth.forEach((v,i)=>{if(!Number.isFinite(v)){connected=false;return;}path+=(connected?'L':'M')+x(i)+' '+yGrowth(v)+' ';connected=true;});
html+=`<path class="line combo-line" d="${path}" stroke="${lineColor}" style="stroke-width:2.6"/>`;
growth.forEach((v,i)=>{if(Number.isFinite(v))html+=`<circle cx="${x(i)}" cy="${yGrowth(v)}" r="3.2" fill="white" stroke="${lineColor}" stroke-width="2"><title>${title(i)}</title></circle>`;});
const last=growth.length-1;if(Number.isFinite(growth[last]))html+=`<text class="combo-last" x="${x(last)-8}" y="${yGrowth(growth[last])-12}" text-anchor="end" fill="${lineColor}">${P(growth[last])}</text>`;
const interval=Math.max(1,Math.ceil(rows.length/12));rows.forEach((row,i)=>{if(i%interval!==0&&i!==rows.length-1)return;const parts=row.period_id.split('-'),month=Number(parts[1]);html+=`<text class="axis" x="${x(i)}" y="${h-b+20}" text-anchor="middle">${month}月</text>`;if(i===0||month===1)html+=`<text class="combo-year" x="${x(i)}" y="${h-b+38}" text-anchor="middle">${parts[0]}</text>`;});
html+=`<rect class="combo-focus" x="0" y="${t}" width="${step}" height="${h-t-b}" fill="#6656bd" opacity=".045" visibility="hidden"/><line class="combo-crosshair" y1="${t}" y2="${h-b}" stroke="#a79fca" stroke-dasharray="3 4" visibility="hidden"/>`;
rows.forEach((row,i)=>{html+=`<rect class="combo-hit" x="${l+i*step}" y="${t}" width="${step}" height="${h-t-b}" fill="transparent" tabindex="0" aria-label="${title(i)}" data-index="${i}"/>`;});
svg.innerHTML=html;
const tip=panel.querySelector('.tooltip'),focus=svg.querySelector('.combo-focus'),crosshair=svg.querySelector('.combo-crosshair');
const show=i=>{focus.setAttribute('x',l+i*step);focus.setAttribute('visibility','visible');crosshair.setAttribute('x1',x(i));crosshair.setAttribute('x2',x(i));crosshair.setAttribute('visibility','visible');if(!tip)return;tip.innerHTML=`<b>${esc(rows[i].period_id)}</b><div><i class="legend-bar"></i><span>${metric.label}</span><strong>${F(values[i],metric.unit==='元'?0:2)} ${metric.unit}</strong></div><div><i class="legend-line"></i><span>同比增速</span><strong>${P(growth[i])}</strong></div>`;tip.style.display='block';tip.style.left=Math.max(8,Math.min(x(i)/w*svg.clientWidth-100,svg.clientWidth-235))+'px';tip.style.top=(svg.offsetTop+32)+'px';};
const hide=()=>{focus.setAttribute('visibility','hidden');crosshair.setAttribute('visibility','hidden');if(tip)tip.style.display='none';};
svg.querySelectorAll('.combo-hit').forEach(hit=>{const i=Number(hit.dataset.index);hit.onmouseenter=()=>show(i);hit.onfocus=()=>show(i);hit.onmouseleave=hide;hit.onblur=hide;});
}
const trendModes={hn:'combo'};
function renderTrend(prefix,rows){
const metric=trendMetrics[document.getElementById(prefix+'-metric').value],combo=trendModes[prefix]==='combo',yoy=trendModes[prefix]==='yoy',title=metric.label+(combo?'与同比增速':yoy?'同比增速':'走势')+(combo?'':'（'+(yoy?'%':metric.unit)+'）');
document.getElementById(prefix+'-trend-title').textContent=title;
const svg=document.getElementById(prefix==='ov'?'ov-sales':'hn-growth');svg.setAttribute('aria-label',title);
const oldLegend=svg.closest('.chart').querySelector('.combo-legend');if(!combo&&oldLegend)oldLegend.remove();
if(combo){drawCombo(svg,rows,metric);return;}
draw(svg,rows,[{name:metric.label+(yoy?'同比':''),get:r=>N(r[yoy?metric.yoy:metric.field]),color:metric.color,unit:yoy?'%':metric.unit}],yoy);
}
function go(t){document.querySelectorAll('.tab,.view').forEach(x=>x.classList.remove('on'));let b=document.querySelector(`.tab[data-view="${t}"]`);if(b)b.classList.add('on');let v=document.getElementById('view-'+t);if(v)v.classList.add('on')}

/* ---------- 海南 ---------- */
let hnSort={key:'period_id',dir:-1};
function renderHainan(){const range=document.getElementById('hn-range').value;
const rows=['2024','2025','2026'].includes(range)?DB.m.filter(r=>String(r.year)===range):DB.m.slice(-Number(range));
const latest=rows.at(-1)||{};document.getElementById('hn-period').textContent=latest.period_id||'暂无数据';
for(const key of ['sales','shoppers','spend']){const m=trendMetrics[key];document.getElementById('hn-'+key).textContent=F(N(latest[m.field]),key==='spend'?0:2);document.getElementById('hn-'+key+'-yoy').innerHTML='同比 '+W(N(latest[m.yoy]));}
renderTrend('hn',rows);renderHnTable(rows);
}
function renderHnTable(rows){let cols=[['period_id','月份'],['shopping_sales_cny_100m','销售额(亿)'],['sales_yoy_pct','金额同比%'],['shoppers_10k','人次(万)'],['shoppers_yoy_pct','人数同比%'],['items_10k','件数(万)'],['spend_per_shopper_cny','每人次消费(元)'],['items_yoy_pct','件数同比%'],['spend_per_shopper_yoy_pct','每人次消费同比%']];
let s=rows.slice().sort((a,b)=>{let av=a[hnSort.key],bv=b[hnSort.key],r=(N(av)!=null&&N(bv)!=null)?N(av)-N(bv):String(av).localeCompare(String(bv));return hnSort.dir*r});
document.getElementById('hn-table').innerHTML='<thead><tr>'+cols.map(([k,l])=>`<th data-k="${k}">${l}<span class="arr">${hnSort.key===k?(hnSort.dir>0?' ▲':' ▼'):''}</span></th>`).join('')+'</tr></thead><tbody>'+
s.map(r=>'<tr>'+cols.map(([k,l])=>{let v=r[k];let disp=(k.includes('yoy'))?`<span class="${C(N(v))}">${P(N(v))}</span>`:(N(v)!=null?F(v,2):Dash(v));return `<td class="${k==='period_id'?'':'num'}">${k==='period_id'?v:disp}</td>`}).join('')+'</tr>').join('')+'</tbody>';
document.querySelectorAll('#hn-table th').forEach(th=>th.onclick=()=>{let k=th.dataset.k;if(hnSort.key===k)hnSort.dir*=-1;else{hnSort.key=k;hnSort.dir=1}renderHnTable(rows)})}

function monthlyRows(){const range=document.getElementById('hn-range').value;return ['2024','2025','2026'].includes(range)?DB.m.filter(r=>String(r.year)===range):DB.m.slice(-Number(range));}
function downloadMonthly(){
const rows=monthlyRows();if(!rows.length)return;
const keys=Object.keys(DB.m[0]),quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
const content='\ufeff'+[keys,...rows.map(r=>keys.map(k=>r[k]))].map(r=>r.map(quote).join(',')).join('\r\n');
const url=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='离岛免税月度-'+document.getElementById('hn-range').value+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function init(){
document.getElementById('asof').textContent='月度截至 '+DB.m.at(-1).period_id;
renderHainan();
document.getElementById('rows-note').textContent=`月度 ${DB.m.length} 条 · 假期 ${DB.h.length} 条`;
document.querySelectorAll('#tabs .tab').forEach(b=>b.onclick=()=>{go(b.dataset.view);location.hash=b.dataset.view;window.scrollTo({top:0})});
const hashView=()=>{let key=location.hash.slice(1);if(['overview','hainan','datacenter'].includes(key)){key='monthly';history.replaceState(null,'',location.pathname+location.search+'#monthly');}go(key==='holidays'?'holidays':'monthly');};hashView();addEventListener('hashchange',hashView);
document.getElementById('hn-range').onchange=renderHainan;
document.getElementById('monthly-download').onclick=downloadMonthly;
document.getElementById('hn-metric').onchange=renderHainan;
document.querySelectorAll('#hn-metric + .trend-modes button').forEach(button=>button.onclick=()=>{trendModes.hn=button.dataset.mode;button.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));renderHainan();});
}
</script></body></html>
