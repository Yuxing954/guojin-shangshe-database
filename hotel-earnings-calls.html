<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#203e61">
  <title>业绩电话会 · 零售&amp;社服数据库</title>
  <link rel="icon" type="image/svg+xml" href="scripts/assets/brand/sinolink-mark.svg">
  <link rel="stylesheet" href="scripts/site.css?v=20261025retailservice2">
  <link rel="stylesheet" href="scripts/site-polish.css?v=20261019simple">
  <link rel="stylesheet" href="scripts/workspace-design.css?v=20261111visual">
  <script defer src="scripts/site-ui.js?v=20261120hotelcalls"></script>
  <script defer src="scripts/site-data.js?v=20261022dates"></script>
  <script defer src="scripts/site-shell.js?v=20261106researchtools2"></script>
  <script defer src="scripts/hotel-earnings-calls.js?v=20261120hotelcalls"></script>
  <style>
    .calls-filters { display:flex; flex-wrap:wrap; align-items:end; gap:10px; margin:16px 0 8px; }
    .calls-filters[hidden] { display:none; }
    .calls-filters label { display:grid; gap:4px; font-size:.875rem; }
    .calls-filters select { min-width:8em; }
    .calls-table-wrap { overflow:auto; border:1px solid #dbe3ea; border-radius:8px; }
    .calls-table { width:100%; border-collapse:collapse; background:white; font-size:.875rem; text-align:left; }
    .calls-table th, .calls-table td { padding:10px 12px; border-bottom:1px solid #e5ebf0; vertical-align:top; }
    .calls-table thead { background:#edf3f8; }
    .calls-table tbody tr:last-child > * { border-bottom:0; }
    .calls-table th, .calls-table .calls-nowrap { white-space:nowrap; }
    .calls-code { font-weight:400; font-size:.8125rem; color:#4a6074; }
    .calls-links { display:flex; flex-wrap:wrap; gap:4px 12px; }
    .calls-links a { white-space:nowrap; text-decoration:underline; text-underline-offset:3px; }
    .calls-pending { color:#86401d; white-space:nowrap; }
    @media (max-width:640px) {
      .calls-table th, .calls-table td { padding:8px; }
      .calls-table .calls-date, .calls-table .calls-event { white-space:normal; }
      .calls-code { display:block; }
      .calls-links { min-width:6em; }
    }
  </style>
</head>
<body class="site-page" data-design="workspace" data-site-section="companies">
<main id="main" class="site-main">
  <nav class="site-subnav" aria-label="重点公司栏目">
    <a href="company-database.html">国内酒店</a>
    <a href="overseas-hotels.html">海外酒店</a>
    <a href="hotel-earnings-calls.html" aria-current="page">业绩电话会</a>
  </nav>
  <header class="portal-header">
    <h1>酒店业绩电话会</h1>
    <a class="source-link" href="data-notes.html#hotel-earnings-calls">来源与说明</a>
  </header>
  <section id="calls-filters" class="calls-filters" aria-label="筛选电话会" hidden>
    <label>公司 <select id="calls-company"><option value="">全部公司</option></select></label>
    <label>年份 <select id="calls-year"><option value="">全部年份</option></select></label>
    <label>资料 <select id="calls-material">
      <option value="">全部资料</option>
      <option value="official">官方逐字稿</option>
      <option value="webcast">官方回放</option>
      <option value="transcript">第三方逐字稿</option>
      <option value="missing">待补</option>
    </select></label>
    <button class="portal-button" type="button" id="calls-export">导出筛选结果</button>
  </section>
  <p id="calls-status" class="portal-note" role="status">正在读取电话会目录…</p>
  <button class="portal-button" type="button" id="calls-retry" hidden>重新读取</button>
  <div id="calls-table" class="calls-table-wrap" role="region" aria-label="电话会目录" tabindex="0" hidden>
    <table class="calls-table">
      <thead><tr><th scope="col">公司</th><th scope="col">报告期</th><th scope="col">会议类型</th><th scope="col">会议日期</th><th scope="col">资料</th></tr></thead>
      <tbody id="calls-rows"></tbody>
    </table>
  </div>
</main>
</body>
</html>
