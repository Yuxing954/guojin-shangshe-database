<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>酒店节假日经营对标 · 国金商社</title>
  <script defer src="scripts/site-ui.js?v=20261012dailybottom"></script>
  <link rel="stylesheet" href="scripts/site.css?v=20261011public">
  <link rel="stylesheet" href="scripts/hotel-dashboard.css?v=20261010coverage">
  <link rel="stylesheet" href="scripts/hotel-holiday-dashboard.css?v=20261012holiday">
  <script defer src="scripts/site-shell.js?v=20261012dailybottom"></script>
  <script defer src="scripts/hotel-metrics.js?v=20261010coverage"></script>
  <script defer src="scripts/hotel-holiday-dashboard.js?v=20261012holiday"></script>
  <link rel="stylesheet" href="scripts/resource-search.css?v=20261010-unified">
  <link rel="stylesheet" href="scripts/site-charts.css?v=20261010combo1">
  <link rel="stylesheet" href="scripts/site-polish.css?v=20261011boards">
</head>
<body class="hotel-page">
<main class="hd-wrap industry-board">
  <header class="hd-header">
    <div><a class="hd-back" href="hotel-dashboard.html">酒店周度经营</a><h1>节假日经营对标</h1></div>
    <div class="hd-updated board-asof" id="asof" aria-live="polite">正在读取数据…</div>
  </header>
  <div id="load-error" class="hd-error" role="alert" hidden></div>
  <div id="holiday-dashboard" hidden>
    <nav class="hd-tabs site-subnav" aria-label="酒店数据看板">
      <a class="hd-tab" href="hotel-dashboard.html">周度经营</a>
      <a class="hd-tab active" href="hotel-holiday-dashboard.html" aria-current="page">节假日经营对标</a>
    </nav>
    <div class="hd-toolbar board-filters holiday-toolbar">
      <label>假期 <select id="holiday-select"></select></label>
      <label>分组 <select id="dimension-select"><option value="hotel_tier">酒店档位</option><option value="city_tier">城市线级</option></select></label>
      <label>对标对象 <select id="segment-select"></select></label>
      <label>走势指标 <select id="metric-select"><option value="revpar">RevPAR（元）</option><option value="occupancy_rate">入住率（%）</option><option value="adr">ADR（元）</option></select></label>
      <a class="hd-source-link" href="data/hotel_holiday_daily.csv" download>下载假期数据</a>
    </div>
    <p class="hd-period" id="period-note"></p>
    <div class="hd-card board-panel holiday-overview-panel">
      <div class="hd-card-head board-panel-head"><h2>五大假期经营概览</h2><span>全国全部 · 期间日均</span></div>
      <div class="hd-table-scroll" tabindex="0" aria-label="五大假期经营概览，可左右滚动"><table class="hd-table board-table" id="holiday-overview-table"></table></div>
    </div>
    <section class="hd-kpis board-kpis holiday-kpis" id="holiday-kpis" aria-label="假期日均经营指标"></section>
    <div class="hd-card board-panel">
      <div class="hd-card-head board-panel-head"><h2 id="trend-title">假期每日经营</h2><span id="trend-note"></span></div>
      <p class="hd-chart-caption" id="trend-caption"></p>
      <div class="hd-chart board-chart holiday-chart" id="holiday-chart" role="img" aria-label="本期与对标期每日酒店经营数据比较"></div>
    </div>
    <div class="hd-card board-panel">
      <div class="hd-card-head board-panel-head"><h2>分组经营对比</h2><span>假期日均 · 按假期第几天对齐</span></div>
      <div class="hd-table-scroll" tabindex="0" aria-label="分组经营对比表，可左右滚动"><table class="hd-table board-table" id="summary-table"></table></div>
    </div>
    <details class="hd-detail hd-card board-detail holiday-daily-detail">
      <summary>每日数据明细</summary>
      <div class="hd-table-scroll" tabindex="0" aria-label="每日酒店经营数据，可左右滚动"><table class="hd-table board-table" id="daily-table"></table></div>
    </details>
    <footer class="hd-footer">来源：酒店之家 · 假期日期按源表保留，年度对照按假期日序对齐</footer>
  </div>
</main>
</body>
</html>
