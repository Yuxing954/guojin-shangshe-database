<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>酒店周度产品 · 国金商社</title>
<script defer src="scripts/site-ui.js?v=20261011weeklyproduct"></script><link rel="stylesheet" href="scripts/site.css?v=20261010-unified"><link rel="stylesheet" href="scripts/hotel-weekly-product.css?v=20261011"><script defer src="scripts/site-shell.js?v=20261011weeklyproduct"></script><script defer src="scripts/hotel-weekly-product.js?v=20261011"></script><link rel="stylesheet" href="scripts/site-polish.css?v=20261011weeklyproduct"></head><body>
<main class="product-workbench"><header class="product-header"><h1>酒店周度产品</h1></header>
<div class="toolbar"><div class="row"><label>数据周<select id="week"></select></label><label>趋势范围<select id="window"><option value="26">近半年</option><option value="52" selected>近一年</option><option value="104">近两年</option></select></label><button id="export" disabled>下载 PNG 长图</button><button class="secondary" id="capture">截图模式</button><button class="secondary" id="refresh">刷新数据</button></div>
<details><summary>编辑点评与署名</summary><label>研究点评<textarea id="comment" rows="3" placeholder="填写对本周数据的判断；留空时显示自动生成的数据描述。"></textarea></label><label>署名<input id="author" value="国金商社研究"></label></details>
<details><summary>导入周度数据 CSV</summary><input type="file" id="upload" accept=".csv,text/csv"></details><p id="status" role="status"></p><a class="source-link" href="data/hotel_industry_weekly.csv" download>下载来源数据</a></div>
<button id="return">返回编辑</button><div class="stage"><canvas id="product" width="1080" height="3140" role="img" aria-label="酒店行业周度跟踪长图：全国经营和四档次同比走势"></canvas></div>
</main></body></html>
