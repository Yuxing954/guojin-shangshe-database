<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>观点纪要 · 国金商社</title><link rel="stylesheet" href="scripts/site.css?v=5"><script defer src="scripts/site-data.js?v=2"></script><script defer src="scripts/site-shell.js?v=3"></script><script defer src="scripts/research-model.js?v=1"></script><script defer src="scripts/research.js?v=4"></script></head>
<body><main id="main"><header class="portal-header"><div><p class="eyebrow">RESEARCH / LIBRARY</p><h1 id="page-title">观点与纪要</h1><p>跟进商社最新观点，查找公司交流与研究资料。</p></div><a class="portal-top-link" href="companies.html">覆盖公司 ↗</a></header>
<div class="portal-status" id="status" role="status">正在读取研究文库…</div><div id="content" hidden>
<div class="research-heading"><div class="portal-tabs" id="research-tabs" aria-label="内容分类"><button data-kind="views" aria-pressed="true">商社观点</button><button data-kind="minutes" aria-pressed="false">纪要与附件</button><button class="research-other" data-kind="all_views" aria-pressed="false">其他市场观点</button></div><p class="portal-note" id="freshness"></p></div>
<section class="research-controls" aria-label="查找研究内容"><div class="portal-filter"><input id="search" type="search" aria-label="搜索观点纪要" placeholder="搜索公司或关键词"><select id="sector" aria-label="研究板块"></select><select id="format" aria-label="纪要资料类型" hidden><option value="">全部资料</option><option value="text">纪要摘要</option><option value="document">文档附件</option><option value="audio">会议音频</option></select></div>
<div class="research-refine"><div id="ranges" class="research-ranges" aria-label="时间范围"><button data-range="" aria-pressed="true">全部时间</button><button data-range="7" aria-pressed="false">近7天</button><button data-range="30" aria-pressed="false">近30天</button></div><details class="research-advanced"><summary>自选日期</summary><div class="portal-filter"><label>开始 <input id="from" type="date" aria-label="开始日期"></label><label>结束 <input id="to" type="date" aria-label="结束日期"></label></div></details><button class="research-reset" id="clear">重置</button></div></section>
<div class="research-result-head"><p id="count" class="portal-note" role="status" aria-live="polite"></p><select id="sort" aria-label="时间排序"><option value="desc">最新在前</option><option value="asc">最早在前</option></select></div><p class="research-library-note portal-note" id="library-note" hidden>纪要摘要可直接阅读，全文查看原文件；文档与音频进入来源查看。</p>
<div class="portal-research-list" id="results"></div><div class="portal-pager"><span id="page-label"></span><div><button id="prev" aria-label="上一页">上一页</button> <button id="next" aria-label="下一页">下一页</button></div></div><div class="research-archive"><p class="portal-subtle" id="source-note"></p><button class="portal-button" id="archive">加载更早观点</button></div></div>
<dialog class="portal-dialog" id="article-dialog" aria-labelledby="article-title"><div class="portal-dialog-head"><div><p class="eyebrow" id="article-kind"></p><h2 id="article-title"></h2><p class="portal-note" id="article-meta"></p></div><button id="close-article" aria-label="关闭正文">×</button></div><div class="portal-dialog-body"><p class="research-reading-note" id="article-note" role="status"></p><div class="portal-prose" id="article-body"></div><div id="article-files" class="research-files" hidden></div><div class="research-source"><a class="portal-button" id="article-source" target="_blank" rel="noopener">查看原始来源 ↗</a></div></div></dialog></main></body></html>
