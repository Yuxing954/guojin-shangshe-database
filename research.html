<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>观点纪要 · 国金商社</title><link rel="stylesheet" href="scripts/site.css?v=5"><link rel="stylesheet" href="scripts/research-library.css?v=1"><script defer src="scripts/site-data.js?v=2"></script><script defer src="scripts/site-shell.js?v=3"></script><script defer src="scripts/research-model.js?v=3"></script><script defer src="scripts/research-library-model.js?v=1"></script><script defer src="scripts/research.js?v=8"></script></head>
<body><main id="main"><header class="portal-header"><div><p class="eyebrow">RESEARCH / CONSUMPTION</p><h1 id="page-title">观点与纪要</h1><p>先读市场怎么看，再核对观点原文、PDF与录音。</p></div><a class="portal-top-link" href="companies.html">覆盖公司 ↗</a></header>
<div class="portal-status" id="status" role="status">正在读取研究文库…</div><div id="content" hidden>
<div class="research-heading"><div class="portal-tabs" id="research-tabs" aria-label="内容分类"><button data-kind="digest" aria-pressed="true">市场观点摘要</button><button data-kind="views" aria-pressed="false">商社观点原文</button><button data-kind="minutes" aria-pressed="false">消费资料 · PDF与录音</button><button class="research-other" data-kind="all_views" aria-pressed="false">其他市场原文</button></div><p class="portal-note" id="freshness"></p></div>
<section class="research-controls" aria-label="查找研究内容"><div class="portal-filter"><input id="search" type="search" aria-label="搜索观点纪要" placeholder="搜索公司、主题或观点"><select id="sector" aria-label="研究板块"></select><select id="format" aria-label="纪要资料类型" hidden><option value="">全部资料</option><option value="text">文字纪要</option><option value="document">PDF与文档</option><option value="audio">会议录音</option></select><select id="processing-state" aria-label="资料处理状态" hidden><option value="">全部处理状态</option><option value="awaiting_file">待获取原文件</option><option value="extracted">PDF已提取</option><option value="transcript_draft">转写待核对</option><option value="reviewed">已核对文字</option></select></div>
<div class="research-refine"><div id="ranges" class="research-ranges" aria-label="时间范围"><button data-range="" aria-pressed="true">全部时间</button><button data-range="7" aria-pressed="false">近7天</button><button data-range="30" aria-pressed="false">近30天</button></div><details class="research-advanced"><summary>自选日期</summary><div class="portal-filter"><label>开始 <input id="from" type="date" aria-label="开始日期"></label><label>结束 <input id="to" type="date" aria-label="结束日期"></label></div></details><button class="research-reset" id="clear">重置</button></div></section>
<div class="research-result-head"><p id="count" class="portal-note" role="status" aria-live="polite"></p><select id="sort" aria-label="时间排序"><option value="desc">最新在前</option><option value="asc">最早在前</option></select></div>
<p class="research-dashboard-note" id="digest-note" hidden></p><div class="research-brief-grid" id="briefs" hidden></div>
<div class="library-stats" id="library-stats" hidden></div><p class="research-library-note portal-note" id="library-note" hidden>按文件收录、按行业查找。已提取内容可在站内阅读；待获取文件需进入知识星球来源。资料日期为帖子发布时间。</p>
<div class="portal-research-list" id="results"></div><div class="portal-pager"><span id="page-label"></span><div><button id="prev" aria-label="上一页">上一页</button> <button id="next" aria-label="下一页">下一页</button></div></div><div class="research-archive"><p class="portal-subtle" id="source-note"></p><button class="portal-button" id="archive">加载更早观点</button></div>
<details class="research-workflow"><summary>资料怎样持续更新</summary><ol><li>收录消费相关文件，保留来源、文件标识、日期与行业。</li><li>PDF提取正文和页码；录音转写并保留时间段。</li><li>核对后整理结论、依据、分歧或适用边界与验证指标，再进入观点摘要。</li></ol><p>未读取的附件不生成内容结论；录音初稿与已核对纪要分开展示。</p></details></div>
<dialog class="portal-dialog" id="article-dialog" aria-labelledby="article-title"><div class="portal-dialog-head"><div><p class="eyebrow" id="article-kind"></p><h2 id="article-title"></h2><p class="portal-note" id="article-meta"></p></div><button id="close-article" aria-label="关闭正文">×</button></div><div class="portal-dialog-body"><p class="research-reading-note" id="article-note" role="status"></p><div class="portal-prose" id="article-body"></div><div id="article-files" class="research-files" hidden></div><div class="research-source"><a class="portal-button" id="article-source" target="_blank" rel="noopener">查看原始来源 ↗</a></div></div></dialog></main></body></html>
