<script id="csv-data-adapter">
(function(){

  for(i=0;i<text.length;i++){c=text[i];next=text[i+1];
    if(quoted){if(c==='"'&&next==='"'){cell+='"';i++;}else if(c==='"'){quoted=false;}else{cell+=c;}}
    else if(c==='"'){quoted=true;}
    else if(c===","){row.push(cell);cell="";}
    else if(c==="\n"){row.push(cell.replace(/\r$/,""));rows.push(row);row=[];cell="";}
    else{cell+=c;}
  }
  if(cell||row.length){row.push(cell.replace(/\r$/,""));rows.push(row);}

  return rows.filter(function(r){return r.some(function(v){return String(v).trim()!=="";});}).map(function(r,ri){
    var o={id:"csv-"+ri,_id:"csv-"+ri};
    head.forEach(function(k,j){var v=(r[j]==null?"":r[j]).trim();

      else if(/^[-+]?\d+(?:\.\d+)?$/.test(v)){o[k]=Number(v);}

      else{o[k]=v;}

  });
}
function adapt(id,rows){

      r["标题"]=r["标题"]||r["公告标题"]||"";

    return fetch(d.file,{cache:"no-store"}).then(function(r){if(!r.ok)throw Error(d.file+" "+r.status);return r.text();}).then(function(t){return adapt(id,parseCSV(t));});

function compare(a,b){if(a==null&&b==null)return 0;if(a==null)return 1;if(b==null)return -1;return a<b?-1:(a>b?1:0);}
function matchFilter(row,f){
  if(!f)return true;
  if(Array.isArray(f))return f.every(function(x){return matchFilter(row,x);});
  if(f.and)return f.and.every(function(x){return matchFilter(row,x);});
  if(f.or)return f.or.some(function(x){return matchFilter(row,x);});
  var key=f.property||f.field||f.name, val=key?row[key]:null, want=("value" in f)?f.value:f.values, op=f.operator||f.condition||"equals";
  if(op==="equals"||op==="eq")return Array.isArray(want)?want.indexOf(val)>=0:String(val)==String(want);

  if(op==="contains")return String(val==null?"":val).indexOf(String(want))>=0;
  if(op==="isNotEmpty")return val!=null&&val!=="";
  if(op==="isEmpty")return val==null||val==="";

  query:function(q){q=q||{};return dataset(q.databaseId).then(function(src){var rows=src.slice();
    if(q.filter||q.filters)rows=rows.filter(function(r){return matchFilter(r,q.filter||q.filters);});

    var size=Math.max(1,Math.min(Number(q.pageSize)||200,1000)),start=Number(q.startCursor)||0,end=start+size;

  var total=all.length,pages=Math.max(1,Math.ceil(total/state.size));if(state.page>pages)state.page=pages;
  var slice=all.slice((state.page-1)*state.size,state.page*state.size);
  var mc=document.getElementById("mCount");if(mc)mc.innerHTML="共 <b>"+total+"</b> 条";
  var list=document.getElementById("list");
  if(!slice.length){list.innerHTML='<div class="empty">'+(state.tab==="gj"?"国金观点 CSV 尚未接入":"当前筛选无内容")+'</div>';renderPager(pages);return;}
  list.innerHTML=slice.map(function(x){var m=x.m;var mt=m.meta.map(function(k){return "<span>"+esc(k[0])+": <b>"+esc(String(k[1]).slice(0,80))+"</b></span>";}).join("");
    var tg=m.tags.map(function(t){return '<span class="'+t.c+'">'+esc(t.t)+"</span>";}).join("");
    var act='';if(m.url){act+='<a class="b" href="'+esc(m.url)+'" target="_blank" rel="noopener">'+(x.e.k==="min"?"下载纪要 ↗":"原文 ↗")+"</a>";}if(m.act2)act+='<span class="eng">'+esc(m.act2)+"</span>";
    var sub=m.sub?'<div class="subline">'+esc(m.sub)+"</div>":"";
    var more=m.sub&&m.sub.length>180?'<button class="readall" type="button" onclick="toggleFull(this)">查看全文</button>':"";
    return '<div class="crd k-'+x.e.k+'"><div class="l1"><span class="lib">'+esc(KF[x.e.k][0])+"</span><span class=\"when\">"+esc(m.when)+"</span>"+mt+'</div><div class="ttl">'+esc(centerTitle(m.ttl,m.sub))+"</div>"+sub+more+tg+'<div class="act">'+act+"</div></div>";
  }).join("");
  renderPager(pages);
}
function toggleFull(btn){var card=btn&&btn.closest?btn.closest(".crd"):null;if(!card)return;var open=card.classList.toggle("expanded");btn.textContent=open?"收起全文":"查看全文";}
function renderPager(pages){var pager=document.getElementById("pager"),h="",i;h+='<button '+(state.page<=1?"disabled":"")+' onclick="state.page--;render()">‹</button>';for(i=Math.max(1,state.page-2);i<=Math.min(pages,state.page+2);i++)h+='<button class="'+(i===state.page?"on":"")+'" onclick="state.page='+i+";render()"+'">'+i+"</button>";h+='<button '+(state.page>=pages?"disabled":"")+' onclick="state.page++;render()">›</button>';pager.innerHTML=h;}
function boot(){
  if(!DB_API){document.getElementById("previewNote").style.display="block";seedDemo();buildTabs();return;}
  var jobs=window.BROWSE_DBS.map(function(e){return loadAll(e.id).then(function(rows){rows.forEach(function(r){var m=typeMeta({e:e,r:r});if(!m.ttl&&!m.sub)return;E.push({e:e,r:r,m:m,key:dateKey(r)||"00000000"});});});});
  Promise.all(jobs).then(function(){buildTabs();}).catch(function(){document.getElementById("previewNote").style.display="block";seedDemo();buildTabs();});
}
function buildTabs(){
  var tb=document.getElementById("tabs");if(!tb)return;
  var labels=[["","全部"],["gj","国金观点"],["mkt","市场观点"],["min","纪要文库"]];
  var h='';labels.forEach(function(t){h+='<span class="tab'+(state.tab===t[0]?" on":"")+'" data-k="'+t[0]+'">'+esc(t[1])+"</span>";});tb.innerHTML=h;
  tb.addEventListener("click",function(ev){var c=ev.target.closest(".tab");if(!c)return;Array.prototype.forEach.call(tb.querySelectorAll(".tab"),function(x){x.classList.remove("on");});c.classList.add("on");state.tab=c.getAttribute("data-k");state.page=1;document.getElementById("marketSubtabs").style.display=state.tab==="mkt"?"flex":"none";render();});
  var ms=document.getElementById("marketSubtabs");if(ms)ms.addEventListener("click",function(ev){var c=ev.target.closest("[data-ms]");if(!c)return;Array.prototype.forEach.call(ms.querySelectorAll("[data-ms]"),function(x){x.classList.remove("on")});c.classList.add("on");state.marketScope=c.getAttribute("data-ms");state.page=1;render();});var sc=document.getElementById("scope");if(sc){sc.innerHTML='<option value="">全部来源</option>'+window.BROWSE_DBS.map(function(e){return '<option value="'+e.k+'">'+esc(e.title)+"</option>";}).join("");sc.addEventListener("change",function(){state.scope=sc.value;state.page=1;render();});}
  var kw=document.getElementById("kw");if(kw){kw.addEventListener("input",(function(){var t=null;return function(){clearTimeout(t);var self=this;t=setTimeout(function(){state.kw=self.value;state.page=1;render();},250);};})());}
  var df=document.getElementById("dateFrom"),dt=document.getElementById("dateTo"),ts=document.getElementById("timeSort"),cd=document.getElementById("clearDate");
  function applyTime(){state.dateFrom=df.value;state.dateTo=dt.value;state.timeSort=ts.value;state.page=1;render();}
  [df,dt,ts].forEach(function(el){el.addEventListener("change",applyTime);});
  cd.addEventListener("click",function(){df.value=dt.value="";state.dateFrom=state.dateTo="";state.page=1;render();});
  render();
}
document.addEventListener("DOMContentLoaded",boot);
</script>
</body></html>
