<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>观点纪要 · 国金商社</title><script defer src="scripts/site-ui.js?v=20261010-unified"></script><link rel="stylesheet" href="scripts/site.css?v=20261010-unified"><link rel="stylesheet" href="scripts/research-library.css?v=6"><script defer src="scripts/site-data.js?v=20261010combo1"></script><script defer src="scripts/site-shell.js?v=20261010sectorsmerge"></script><script defer src="scripts/research-model.js?v=20261010sectorsmerge"></script><script defer src="scripts/research-library-model.js?v=7"></script><script defer src="scripts/research.js?v=20261011-minutes-load"></script><link rel="stylesheet" href="scripts/resource-search.css?v=20261010-unified"><link rel="stylesheet" href="scripts/site-charts.css?v=20261010combo1"><link rel="stylesheet" href="scripts/site-polish.css?v=20261010-unified"><style>.research-list-actions,.research-load{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.research-list-actions{justify-content:flex-end}.research-load[hidden]{display:none}.research-load .portal-button{padding:7px 12px;font-size:13px}.research-load .portal-subtle{font-size:12px}@media(max-width:640px){.research-result-head{align-items:flex-start;flex-wrap:wrap}.research-list-actions{width:100%;justify-content:space-between}.research-load{gap:8px}}</style><script src="scripts/site-charts.js?v=20261010combo1"></script></head>
<body><main id="main"><header class="portal-header"><div><p class="eyebrow">研究资料</p><h1 id="page-title">观点纪要</h1></div><a class="portal-top-link" href="quotes.html">覆盖公司 ↗</a></header>
<div class="portal-status" id="status" role="status">正在读取研究文库…</div><div id="content" hidden>
<div class="research-heading"><div class="portal-tabs" id="research-tabs" aria-label="内容分类"><button data-kind="digest" aria-pressed="true">观点摘要</button><button data-kind="views" aria-pressed="false">板块观点</button><button data-kind="all_views" aria-pressed="false">全部观点</button><button data-kind="minutes" aria-pressed="false">纪要文库</button></div><p class="portal-note" id="freshness"></p></div>

<section class="research-controls" aria-label="查找研究内容"><div class="portal-filter"><input id="search" type="search" aria-label="搜索观点纪要" placeholder="搜索公司、主题或观点"><select id="sector" aria-label="研究板块"></select><button class="research-reset" id="clear">重置</button></div>
<details class="research-more" id="more-filters"><summary>日期与其他筛选</summary><div class="research-extra-filters"><div id="library-scope" class="research-ranges library-scope" aria-label="纪要范围" hidden><button data-scope="archived" aria-pressed="true">纪要文库</button><button data-scope="all" aria-pressed="false">待获取线索</button></div><select id="format" aria-label="纪要资料类型" hidden><option value="">全部资料</option><option value="text">文字纪要</option><option value="document">PDF与文档</option><option value="audio">会议录音</option></select><select id="processing-state" aria-label="资料处理状态" hidden><option value="">全部处理状态</option><option value="summary_draft">摘要待审阅</option><option value="needs_review">关键口径待核对</option><option value="awaiting_file">待获取原文件</option><option value="awaiting_text">原件已入库，文字待整理</option><option value="extracted">PDF已提取</option><option value="transcript_draft">转写待核对</option><option value="reviewed">已核对文字</option></select><div id="ranges" class="research-ranges" aria-label="时间范围"><button data-range="" aria-pressed="true">全部时间</button><button data-range="7" aria-pressed="false">近7天</button><button data-range="30" aria-pressed="false">近30天</button></div><label>开始 <input id="from" type="date" aria-label="开始日期"></label><label>结束 <input id="to" type="date" aria-label="结束日期"></label></div></details></section>
<div class="research-result-head"><p id="count" class="portal-note" role="status" aria-live="polite"></p><div class="research-list-actions"><div class="research-load" id="load-controls"><span class="portal-subtle" id="source-note"></span><button class="portal-button" id="recent-more" hidden>查看更多观点</button><button class="portal-button" id="archive" hidden>查看历史观点</button></div><select id="sort" aria-label="时间排序"><option value="desc">最新在前</option><option value="asc">最早在前</option></select></div></div>
<div class="research-brief-grid" id="briefs" hidden></div>
<div class="library-stats" id="library-stats" hidden></div>
<div class="portal-research-list" id="results"></div><div class="portal-pager"><span id="page-label"></span><div><button id="prev" aria-label="上一页">上一页</button> <button id="next" aria-label="下一页">下一页</button></div></div>
</div>
<dialog class="portal-dialog" id="article-dialog" aria-labelledby="article-title"><div class="portal-dialog-head"><div><p class="eyebrow" id="article-kind"></p><h2 id="article-title"></h2><p class="portal-note" id="article-meta"></p></div><button id="close-article" aria-label="关闭正文">×</button></div><div class="portal-dialog-body"><p class="research-reading-note" id="article-note" role="status"></p><div class="portal-prose" id="article-body"></div><div id="article-files" class="research-files" hidden></div><div class="research-source"><a class="portal-button" id="article-source" target="_blank" rel="noopener">查看原始来源 ↗</a></div></div></dialog></main></body></html>
