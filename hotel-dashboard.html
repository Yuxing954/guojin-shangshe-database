<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>酒店行业经营看板</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#182331;--mut:#728094;--line:#e2e7ed;--blue:#315a7d;--blue2:#eaf2f8;--red:#bd4348;--green:#278068;--font:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px}.wrap{max-width:1240px;margin:auto;padding:28px 24px 60px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:18px}.eyebrow{font-size:11px;color:var(--blue);letter-spacing:.12em}.hero h1{margin:5px 0 4px;font-size:27px;letter-spacing:-.03em}.hero p{margin:0;color:var(--mut);font-size:12px}.asof{font-size:11px;color:var(--mut)}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid #d5dde6;background:#fff;color:#506176;border-radius:8px;padding:8px 13px;cursor:pointer;font-family:inherit}.tab.on{background:#19344b;color:#fff;border-color:#19344b}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 28px -24px rgba(20,40,60,.4);overflow:hidden;margin-bottom:14px}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:15px 17px;border-bottom:1px solid #edf0f4}.panel-head h2{font-size:15px;margin:0}.panel-head p{font-size:10px;color:var(--mut);margin:3px 0 0}.controls{display:flex;gap:7px}.controls select{border:1px solid #d8e0e8;border-radius:7px;padding:6px 9px;background:#fff;font-family:inherit;color:#405166}.kpis{display:grid;grid-template-columns:repeat(4,1fr)}.kpi{padding:16px 18px;border-right:1px solid #edf0f4}.kpi:last-child{border:0}.kpi span{display:block;color:var(--mut);font-size:10px}.kpi strong{display:block;margin-top:4px;font-size:23px;letter-spacing:-.03em}.kpi small{font-size:10px;color:var(--mut)}.up{color:var(--red)!important}.down{color:var(--green)!important}.chart-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}.chart{padding:15px 16px}.chart h3{font-size:12px;margin:0 0 10px}.chart svg{display:block;width:100%;height:220px}.gridline{stroke:#edf0f4;stroke-width:1}.axis{fill:#8895a5;font-size:9px}.line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.area{opacity:.08}.segment-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;padding:14px}.segment{border:1px solid #e5e9ee;border-radius:10px;padding:13px}.segment h3{font-size:12px;margin:0 0 10px}.segment b{font-size:19px}.segment p{margin:5px 0 0;color:var(--mut);font-size:10px}.table{width:100%;border-collapse:collapse}.table th{background:#f6f8fa;color:#7b8795;font-size:10px;text-align:left;padding:9px 12px}.table td{border-top:1px solid #edf0f4;padding:11px 12px}.num{text-align:right;font-variant-numeric:tabular-nums}.spark{width:110px;height:28px}.bars{padding:14px 18px}.barrow{display:grid;grid-template-columns:110px 1fr 90px;gap:12px;align-items:center;margin:10px 0}.bar{height:9px;background:#edf1f4;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:#5f8da4;border-radius:999px}.share-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:14px}.share{border:1px solid #e4e8ed;border-radius:10px;padding:13px}.share strong{font-size:20px}.share span{display:block;font-size:11px;color:var(--mut)}.view{display:none}.view.on{display:block}.empty{padding:30px;text-align:center;color:var(--mut)}
@media(max-width:800px){.wrap{padding:18px 12px}.hero{align-items:flex-start;flex-direction:column}.kpis{grid-template-columns:repeat(2,1fr)}.chart-grid{grid-template-columns:1fr}.segment-grid{grid-template-columns:repeat(2,1fr)}.share-grid{grid-template-columns:1fr}.table-wrap{overflow:auto}.table{min-width:720px}}
</style></head><body><div class="wrap"><header class="hero"><div><div class="eyebrow">HOTEL INDUSTRY</div><h1>酒店行业经营看板</h1><p>全国与上海经营趋势、酒店档次、集团经营、供给结构和集团市占率</p></div><div class="asof" id="asof">读取数据中…</div></header>
<nav class="tabs"><button class="tab on" data-view="market">行业经营</button><button class="tab" data-view="segment">档次结构</button><button class="tab" data-view="group">酒店集团</button><button class="tab" data-view="supply">供给结构</button><button class="tab" data-view="share">集团市占率</button></nav>
<section class="view on" id="view-market"><div class="panel"><div class="panel-head"><div><h2>最新经营快照</h2><p id="period"></p></div><div class="controls"><select id="region"><option>全国</option><option>上海</option></select><select id="range"><option value="26">近26周</option><option value="52" selected>近52周</option><option value="9999">全部</option></select></div></div><div class="kpis"><div class="kpi"><span>入住率 OCC</span><strong id="occ">—</strong><small id="occw">—</small></div><div class="kpi"><span>平均房价 ADR</span><strong id="adr">—</strong><small id="adrw">—</small></div><div class="kpi"><span>每间可售房收入 RevPAR</span><strong id="rev">—</strong><small id="revw">—</small></div><div class="kpi"><span>酒店房量</span><strong id="rooms">—</strong><small>全档口径</small></div></div></div><div class="chart-grid"><div class="panel chart"><h3>ADR 与 RevPAR（元）</h3><svg id="money"></svg></div><div class="panel chart"><h3>入住率 OCC（%）</h3><svg id="occchart"></svg></div></div></section>
<section class="view" id="view-segment"><div class="panel"><div class="panel-head"><div><h2>最新周分档次经营</h2><p>同一周横向比较 OCC、ADR 与 RevPAR</p></div></div><div class="segment-grid" id="segments"></div></div></section>
<section class="view" id="view-group"><div class="panel"><div class="panel-head"><div><h2>酒店集团经营对比</h2><p>最新可得周，点击列头不改变源数据</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>集团</th><th class="num">酒店数</th><th class="num">房量</th><th class="num">ADR</th><th class="num">价格指数</th><th class="num">热度指数</th><th>近12周 ADR</th></tr></thead><tbody id="groups"></tbody></table></div></div></section>
<section class="view" id="view-supply"><div class="panel"><div class="panel-head"><div><h2>供给结构</h2><p id="supply-period">按酒店房量区间观察供给与连锁化</p></div></div><div class="bars" id="supply"></div></div></section>
<section class="view" id="view-share"><div class="panel"><div class="panel-head"><div><h2>六大酒店集团市占率</h2><p id="share-year">年度房间数占比</p></div></div><div class="share-grid" id="shares"></div></div></section>
</div><script>
function csv(t){let a=[],r=[],v='',q=false;for(let i=0;i<t.length;i++){let c=t[i],n=t[i+1];if(q){if(c==='"'&&n==='"'){v+='"';i++}else if(c==='"')q=false;else v+=c}else if(c==='"')q=true;else if(c===','){r.push(v);v=''}else if(c==='\n'){r.push(v.replace(/\r$/,''));a.push(r);r=[];v=''}else v+=c}if(v||r.length){r.push(v);a.push(r)}let h=a.shift().map(x=>x.replace(/^\ufeff/,''));return a.filter(x=>x.some(Boolean)).map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]])))}
const N=x=>{let n=Number(x);return isFinite(n)?n:null},F=(x,d=1)=>N(x)==null?'—':N(x).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d}),C=(v)=>v>0?'up':v<0?'down':'',W=(v,s='')=>N(v)==null?'—':`<span class="${C(v)}">${v>0?'+':''}${F(v,1)}${s}</span>`;
let D={};Promise.all([['industry','data/hotel_industry_weekly.csv'],['group','data/hotel_group_weekly.csv'],['supply','data/hotel_supply_weekly.csv'],['share','data/hotel_market_share_annual.csv']].map(([k,u])=>fetch(u).then(r=>r.text()).then(t=>D[k]=csv(t)))).then(init).catch(e=>document.body.innerHTML='<div class="empty">酒店数据读取失败，请刷新重试</div>');
function line(svg,series,colors){let w=600,h=210,p=25,all=series.flatMap(s=>s.values).filter(Number.isFinite),mi=Math.min(...all),ma=Math.max(...all),sp=ma-mi||1,x=i=>p+i/(series[0].values.length-1)*(w-p*2),y=v=>p+(ma-v)/sp*(h-p*2),html='';for(let j=0;j<4;j++){let yy=p+j*(h-p*2)/3;html+=`<line class="gridline" x1="${p}" y1="${yy}" x2="${w-p}" y2="${yy}"/>`}series.forEach((s,j)=>{let d=s.values.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');html+=`<path class="line" d="${d}" stroke="${colors[j]}"/>`});svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.innerHTML=html}
function wow(a,k,pct=false){if(a.length<2)return'—';let x=N(a.at(-1)[k]),b=N(a.at(-2)[k]),v=pct?(x-b)*100:(x/b-1)*100;return `环比 ${W(v,'%')}`}
function market(){let reg=document.getElementById('region').value,lim=+document.getElementById('range').value,a=D.industry.filter(r=>r.region===reg&&r.segment==='全部').sort((x,y)=>x.period_id.localeCompare(y.period_id)).slice(-lim),z=a.at(-1);if(!z)return;period.textContent=z.start_date+' 至 '+z.end_date;asof.textContent='数据截至 '+z.period_id;occ.textContent=F(N(z.occupancy_rate)*100,1)+'%';adr.textContent=F(z.adr,1);rev.textContent=F(z.revpar,1);rooms.textContent=F(z.room_count,0);occw.innerHTML=wow(a,'occupancy_rate',true);adrw.innerHTML=wow(a,'adr');revw.innerHTML=wow(a,'revpar');line(money,[{values:a.map(x=>N(x.adr))},{values:a.map(x=>N(x.revpar))}],['#315a7d','#bd7b43']);line(occchart,[{values:a.map(x=>N(x.occupancy_rate)*100)}],['#278068'])}
function segments(){let latest=D.industry.filter(r=>r.region==='全国').reduce((m,r)=>r.period_id>m?r.period_id:m,''),a=D.industry.filter(r=>r.region==='全国'&&r.period_id===latest&&r.segment!=='全部');document.getElementById('segments').innerHTML=a.map(r=>`<div class="segment"><h3>${r.segment}</h3><b>${F(r.revpar,1)}</b><p>RevPAR（元）</p><p>OCC ${F(N(r.occupancy_rate)*100,1)}% · ADR ${F(r.adr,0)}</p></div>`).join('')}
function spark(vals){let w=110,h=28,mi=Math.min(...vals),ma=Math.max(...vals),sp=ma-mi||1,d=vals.map((v,i)=>(i?'L':'M')+(i/(vals.length-1)*w).toFixed(1)+' '+((ma-v)/sp*(h-4)+2).toFixed(1)).join(' ');return `<svg class="spark" viewBox="0 0 ${w} ${h}"><path d="${d}" fill="none" stroke="#315a7d" stroke-width="1.7"/></svg>`}
function groups(){let gs=[...new Set(D.group.map(r=>r.group))],html=gs.map(g=>{let a=D.group.filter(r=>r.group===g).sort((x,y)=>x.period_id.localeCompare(y.period_id)),z=a.at(-1),v=a.slice(-12).map(x=>N(x.adr)).filter(Number.isFinite);return `<tr><td>${g}<small style="display:block;color:#8b96a6">${z.period_id}</small></td><td class="num">${F(z.hotel_count,0)}</td><td class="num">${F(z.room_count,0)}</td><td class="num">${F(z.adr,1)}</td><td class="num">${F(z.price_index,2)}</td><td class="num">${F(z.heat_index,2)}</td><td>${spark(v)}</td></tr>`}).join('');document.getElementById('groups').innerHTML=html}
function supply(){let latest=D.supply.reduce((m,r)=>r.period_id>m?r.period_id:m,''),a=D.supply.filter(r=>r.period_id===latest&&r.room_band!=='全部'),tot=a.reduce((s,r)=>s+N(r.room_count),0);document.getElementById('supply-period').textContent=latest+' · 房量占比与连锁化率';document.getElementById('supply').innerHTML=a.map(r=>{let sh=N(r.room_count)/tot*100,chain=N(r.chain_room_count)/N(r.room_count)*100;return `<div class="barrow"><span>${r.room_band}</span><div class="bar"><i style="width:${sh}%"></i></div><b>${F(sh,1)}% <small style="color:#8190a2">连锁 ${F(chain,1)}%</small></b></div>`}).join('')}
function shares(){let y=Math.max(...D.share.map(r=>+r.year)),a=D.share.filter(r=>+r.year===y).sort((x,z)=>N(z.market_share_pct)-N(x.market_share_pct));document.getElementById('share-year').textContent=y+' 年 · 房间数占比';document.getElementById('shares').innerHTML=a.map(r=>`<div class="share"><span>${r.group}</span><strong>${F(r.market_share_pct,2)}%</strong></div>`).join('')}
function init(){market();segments();groups();supply();shares();document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.view').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById('view-'+b.dataset.view).classList.add('on')});region.onchange=market;range.onchange=market}
</script></body></html>
