<body class="site-page macro-hub" data-site-section="macro">
<main class="site-main data-board cm-main">

  <nav class="portal-tabs site-subnav section-category-nav" aria-label="宏观数据子栏目"><a href="consumption-macro.html" class="current" aria-current="page"><span class="industry-sector-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4zM8 6V4h8v2M8 11h8M8 15h5"/></svg></span><span>消费全景</span></a><a href="macro.html?view=indicators"><span class="industry-sector-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16M7 16V9M12 16V5M17 16v-5"/></svg></span><span>核心指标</span></a><a href="macro.html?view=fedwatch"><span class="industry-sector-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/></svg></span><span>FedWatch</span></a><a href="macro.html?view=predictions"><span class="industry-sector-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18 9 12l4 3 7-10M16 5h4v4"/></svg></span><span>Polymarket</span></a></nav>
  <p id="asof" class="portal-note"></p><p id="status" class="portal-status" role="status">正在读取消费全景数据…</p>
  <p id="automatic-warning" class="cm-error" role="status" hidden>补充历史未加载，当前展示已核验官方记录。<button id="retry-load" class="portal-button">重试</button></p>
  <div id="content" hidden>
    <nav id="consumption-views" class="site-subnav cm-study-tabs" aria-label="消费研究视图"><button data-cm-view="overview" aria-pressed="true">总览</button><button data-cm-view="structure" aria-pressed="false">消费拆分</button><button data-cm-view="income" aria-pressed="false">收入与价格</button><button data-cm-view="workspace" aria-pressed="false">指标查询</button></nav>
    <section id="consumption-summary" aria-label="消费核心读数"><div class="cm-section-head board-section-head"><h2 id="consumption-summary-title">消费核心读数</h2><nav class="site-subnav" aria-label="读数期间"><button data-period-mode="latest" aria-pressed="true">最新读数</button><button data-period-mode="aligned" aria-pressed="false">同频同期</button></nav></div><div id="kpis"></div></section>
    <section id="retail-panel" class="portal-panel retail-panel board-panel" aria-labelledby="retail-heading">
      <div class="portal-panel-head board-panel-head"><div><p class="eyebrow">消费拆分</p><h2 id="retail-heading">社零拆分</h2></div><span id="retail-context" class="portal-note"></span></div>
      <div class="cm-filter board-filters"><label>统计口径<select id="retail-basis"><option value="month">当月 / 1—2月</option><option value="ytd">年初累计</option><option value="year">全年</option></select></label><label>数据期间<select id="retail-period"></select></label><nav class="retail-tabs site-subnav" aria-label="社零拆分维度"><button data-retail="categories" aria-pressed="true">分品类</button><button data-retail="structure" aria-pressed="false">商品与餐饮</button><button data-retail="channels" aria-pressed="false">城乡与渠道</button></nav></div>
      <p id="retail-note" class="portal-note"></p><div id="retail-bars" class="retail-bars"></div><p class="chart-help"></p>
    </section>
    <details id="consumption-directory" class="portal-panel cm-directory board-panel board-detail"><summary>全部消费指标与下载</summary>
      <div class="portal-panel-head board-panel-head"><h2 id="directory-title">指标总览</h2><span id="coverage" class="portal-note"></span></div>
      <div class="portal-filter cm-filter board-filters">
        <label>类别 <select id="group"><option value="">全部类别</option></select></label>
        <label>频率 <select id="frequency"><option value="">全部频率</option><option value="monthly">月度</option><option value="quarterly">季度</option><option value="annual">年度</option></select></label>
        <label>状态 <select id="connection"><option value="">全部状态</option><option value="connected">已接入</option><option value="pending">待接入</option></select></label>
        <input id="query" type="search" aria-label="搜索消费指标" placeholder="社零、餐饮、收入…">
        <button id="reset" class="portal-button">重置</button>
      </div>
      <div class="portal-table-scroll" tabindex="0" role="region" aria-label="指标总览表"><table class="portal-table cm-table board-table"><thead><tr><th scope="col">指标</th><th scope="col">最新已收录值</th><th scope="col">同比</th><th scope="col">数据期间 / 口径</th><th scope="col">发布日期 / 来源</th><th scope="col">状态</th></tr></thead><tbody id="directory"></tbody></table></div>
      <div class="portal-pager"><span id="page-label" aria-live="polite"></span><div><button id="prev">上一页</button> <button id="next">下一页</button></div><button id="export-latest" class="portal-button">导出筛选结果 CSV</button></div>
    </details>
    <section class="portal-panel board-panel" id="trend-panel" aria-labelledby="trend-title">
      <div class="portal-panel-head board-panel-head"><h2 id="trend-title">历史趋势</h2><button id="export-series" class="portal-button">导出当前历史 CSV</button></div>
      <div class="cm-filter cm-trend-controls board-filters">
        <label class="cm-indicator-control">指标 <select id="indicator"></select></label>
        <label>频率 <select id="series-frequency"></select></label>
        <label>口径 <select id="basis"></select></label>
        <label>显示 <select id="measure"><option value="combo">数值＋同比</option><option value="value">仅数值</option><option value="yoy">官方同比</option><option value="mom">官方环比</option><option value="realYoy">实际同比</option></select></label>
        <label>开始 <input id="from" type="date"></label><label>结束 <input id="to" type="date"></label>
        <button id="clear-range" class="portal-button">全部历史</button>
      </div>
      <p id="series-definition" class="portal-note"></p><div id="range-error" class="cm-error" role="alert" hidden></div>
      <div id="chart" class="cm-chart board-chart"></div><p class="chart-help">移动鼠标查看具体数值 · 手机轻触数据点</p><p id="chart-caption" class="portal-note" aria-live="polite"></p>
      <details class="cm-details board-detail"><summary>历史数据与来源</summary>
        <div class="portal-table-scroll" tabindex="0" role="region" aria-label="历史数据表"><table class="portal-table cm-table board-table"><thead><tr><th scope="col">数据期间</th><th scope="col">口径</th><th scope="col" id="value-heading">数值</th><th scope="col">同比</th><th scope="col">备注 / 其他增速</th><th scope="col">发布日期</th><th scope="col">原始来源</th></tr></thead><tbody id="history"></tbody></table></div>
      </details>
    </section>

  </div>
</main>
